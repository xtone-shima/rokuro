<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4eee5">
<title>ろくろ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#2e2823; --sub:#85786c; --paper:#f4eee5; --paper-deep:#e0d5c6; --line:rgba(46,40,35,.16);
    --chip:rgba(255,255,255,.55); --btn:#2e2823; --btn-ink:#f7f1e8;
    --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --sans:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
  }
  body.dark { --ink:#f6e9d8; --sub:#c9a98a; --line:rgba(246,233,216,.22); --chip:rgba(60,28,14,.5); --btn:#f6e9d8; --btn-ink:#2a140b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink);
               font-family:var(--sans); -webkit-user-select:none; user-select:none; overscroll-behavior:none; -webkit-touch-callout:none; }
  .bg { position:fixed; inset:0; }
  .bg.paper { background:radial-gradient(120% 90% at 50% 38%, #fbf8f2 0%, var(--paper) 45%, var(--paper-deep) 100%); }
  .bg.kiln { background:radial-gradient(90% 70% at 50% 88%, #7a2a0a 0%, #3a1407 38%, #150a06 72%, #0a0605 100%); opacity:0; transition:opacity 1.4s ease; }
  .bg.glow { background:radial-gradient(70% 55% at 50% 92%, rgba(255,120,30,.8) 0%, rgba(230,70,10,.3) 45%, rgba(200,40,0,0) 75%); opacity:0; mix-blend-mode:screen; }
  body.kilnbg .bg.kiln { opacity:1; }
  canvas#fire { position:fixed; left:0; bottom:0; width:100%; height:78%; opacity:0; filter:blur(14px) saturate(1.25); pointer-events:none; }
  canvas#stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas#stage.touching { cursor:grabbing; }

  .head { position:fixed; left:22px; top:calc(18px + var(--safe-t)); pointer-events:none; transition:color .8s; }
  .head h1 { margin:0; font-family:var(--mincho); font-weight:700; font-size:24px; letter-spacing:.18em; }
  .head .step { margin-top:6px; font-family:var(--mincho); font-size:13px; letter-spacing:.2em; color:var(--sub); transition:color .8s; }

  .tools { position:fixed; right:16px; top:calc(16px + var(--safe-t)); display:flex; gap:8px; }
  .chip { font:500 12px var(--sans); letter-spacing:.08em; color:var(--ink); background:var(--chip);
          border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer;
          -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); transition:color .8s, background .8s, border-color .8s; }
  .chip:active { filter:brightness(1.15); }

  .temp { position:fixed; left:0; right:0; top:calc(74px + var(--safe-t)); text-align:center; pointer-events:none;
          font-family:var(--mincho); color:var(--ink); opacity:0; transition:opacity .8s; }
  .temp b { font-weight:500; font-size:44px; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  .temp span { font-size:16px; margin-left:4px; color:var(--sub); }
  .temp small { display:block; margin-top:2px; font-size:12px; letter-spacing:.3em; color:var(--sub); min-height:1.4em; }
  body.s-kiln .temp { opacity:1; }

  .dock { position:fixed; left:0; right:0; bottom:calc(20px + var(--safe-b)); display:flex; flex-direction:column; align-items:center; gap:14px;
          pointer-events:none; padding:0 16px; }
  .dock > * { pointer-events:auto; }
  .hint { pointer-events:none; text-align:center; font-family:var(--mincho); font-size:14px; letter-spacing:.12em; line-height:1.95;
          color:var(--ink); transition:opacity .8s, color .8s; max-width:34em; }
  .hint.gone { opacity:0; }
  .hint span { display:inline-block; padding:0 .5em; }
  .hint .view { font-size:12px; color:var(--sub); }

  .swatches { display:none; gap:10px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
  body.s-glaze .swatches { display:flex; }
  .sw { width:52px; background:none; border:0; padding:0; cursor:pointer; font-family:var(--mincho); color:var(--sub); font-size:11px; letter-spacing:.1em; text-align:center; }
  .sw i { display:block; width:38px; height:38px; margin:0 auto 5px; border-radius:50%; border:1px solid rgba(46,40,35,.2);
          box-shadow:inset 0 -6px 10px rgba(0,0,0,.18), inset 0 5px 8px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.12); transition:transform .2s; }
  .sw.on { color:var(--ink); font-weight:700; }
  .sw.on i { transform:scale(1.16); box-shadow:inset 0 -6px 10px rgba(0,0,0,.18), inset 0 5px 8px rgba(255,255,255,.35), 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }

  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .next { font:700 15px var(--mincho); letter-spacing:.22em; color:var(--btn-ink); background:var(--btn); border:0; border-radius:999px;
          padding:14px 30px 14px 34px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.18); transition:opacity .5s, transform .15s, background .8s, color .8s; }
  .next:active { transform:scale(.97); }
  .next.ghost { background:var(--chip); color:var(--ink); border:1px solid var(--line); box-shadow:none; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .hide { display:none !important; }
  .fadeout { opacity:0; pointer-events:none !important; }

  .caption { position:fixed; left:24px; bottom:calc(128px + var(--safe-b)); pointer-events:none; opacity:0; transform:translateY(6px);
             transition:opacity 1.2s ease .4s, transform 1.2s ease .4s; font-family:var(--mincho); }
  body.s-done .caption { opacity:1; transform:none; }
  .caption .name { font-size:24px; font-weight:700; letter-spacing:.16em; }
  .caption .spec { margin-top:8px; font-size:12px; letter-spacing:.12em; color:var(--sub); line-height:1.9; font-variant-numeric:tabular-nums; }
  .caption .rule { width:28px; height:1px; background:var(--ink); margin:12px 0 0; opacity:.5; }

  .warn { position:fixed; left:50%; top:calc(66px + var(--safe-t)); transform:translate(-50%,-8px); opacity:0; pointer-events:none;
          font-family:var(--mincho); font-size:14px; letter-spacing:.14em; color:#fff; background:rgba(120,58,42,.92);
          padding:8px 18px; border-radius:999px; transition:opacity .25s, transform .25s; white-space:nowrap; }
  .warn.show { opacity:1; transform:translate(-50%,0); }

  .finger { position:fixed; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; pointer-events:none;
            border:1px solid rgba(46,40,35,.28); background:radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
            opacity:0; transition:opacity .2s; }
  .finger.on { opacity:1; }
  body.dark .finger { border-color:rgba(255,220,180,.4); background:radial-gradient(circle, rgba(255,190,120,.3), rgba(255,160,80,0) 70%); }

  .intro { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
           background:rgba(244,238,229,.78); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); transition:opacity .9s ease; padding:24px; }
  .intro h2 { margin:0; font-family:var(--mincho); font-weight:700; font-size:54px; letter-spacing:.3em; text-indent:.3em; }
  .intro p { margin:26px 0 0; font-family:var(--mincho); font-size:16px; letter-spacing:.2em; line-height:2.1; }
  .intro p.sub { margin-top:6px; color:var(--sub); font-size:13px; }
  .intro .next { margin-top:40px; }
  .intro small { margin-top:22px; font-size:11px; letter-spacing:.1em; color:var(--sub); line-height:1.8; }

  .veil { position:fixed; inset:0; background:#0d0705; opacity:0; pointer-events:none; transition:opacity .55s ease; }
  .veil.on { opacity:1; }

  @media (max-width:560px) {
    .head h1 { font-size:21px; } .hint { font-size:13px; } .temp b { font-size:38px; }
    .caption { left:20px; bottom:calc(140px + var(--safe-b)); } .caption .name { font-size:21px; }
    .sw { width:46px; } .sw i { width:34px; height:34px; }
  }
</style>
</head>
<body class="s-intro">
<div class="bg paper"></div>
<div class="bg kiln"></div>
<canvas id="fire" width="120" height="180"></canvas>
<div class="bg glow" id="glow"></div>
<canvas id="stage"></canvas>

<div class="head">
  <h1>ろくろ</h1>
  <div class="step" id="step">一　形をつくる</div>
</div>

<div class="tools">
  <button class="chip" id="btnSound" type="button">音　入</button>
  <button class="chip" id="btnReset" type="button">はじめから</button>
</div>

<div class="temp" id="temp"><b id="tempNum">20</b><span>℃</span><small id="tempWord"></small></div>

<div class="caption" id="caption">
  <div class="name" id="capName"></div>
  <div class="rule"></div>
  <div class="spec" id="capSpec"></div>
</div>

<div class="dock">
  <div class="hint" id="hint"></div>
  <div class="swatches" id="swatches"></div>
  <div class="row">
    <button class="next ghost hide" id="btnAgain" type="button">もういちど</button>
    <button class="next" id="btnNext" type="button">釉薬をかける</button>
  </div>
</div>

<div class="warn" id="warn">へたってしまった</div>
<div class="finger" id="finger"></div>
<div class="veil" id="veil"></div>

<div class="intro" id="intro">
  <h2>ろくろ</h2>
  <p>土をかたちにして、釉薬をかけ、火で焼く。</p>
  <p class="sub">同じ器は、二度とできません。</p>
  <button class="next" id="btnStart" type="button">はじめる</button>
  <small>スマートフォンでは、本体の傾きと、息を使います。<br>音が出ます。</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const FAST = /[?&]fast\b/.test(location.search);          // 動作確認用：描画を軽くする
  function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  /* =====================================================================
     段階 ―― intro → shape（形）→ glaze（釉薬）→ kiln（焼く）→ cool（冷ます）→ done（できあがり）
     ===================================================================== */
  let stage = 'intro';
  function setStageClass(s) {
    document.body.className = document.body.className.replace(/\bs-\w+/g, '').trim() + ' s-' + s;
  }

  /* =====================================================================
     粘土の形 ―― 器を「高さごとの半径」の並びで持つ（回転体なのでこれで足りる）。1.0 = 10cm
     ===================================================================== */
  const N = 72;                 // 高さ方向の分割数
  const T_SLUMP = 0.05;         // 壁がこれより薄くなると、へたる
  const H_MIN = 0.3, H_MAX = 2.6, R_MIN = 0.1, R_MAX = 1.45;
  // r / H が「いまの形」、rt / Ht が「指が押して向かわせている形」。いまの形は少し遅れて追いかける（じわっと寄る）
  const clay = { H: 0, Ht: 0, r: new Float32Array(N), rt: new Float32Array(N), ridge: new Float32Array(N), V: 0, t: 0.2, off: 0 };

  function surfaceArea(H, r) {
    let a = Math.PI * r[0] * r[0];
    const dy = H / (N - 1);
    for (let i = 0; i < N - 1; i++) a += Math.PI * (r[i] + r[i + 1]) * Math.hypot(dy, r[i + 1] - r[i]);
    return a;
  }
  function resetClay() {
    clay.H = clay.Ht = 0.85;
    for (let i = 0; i < N; i++) {
      const s = i / (N - 1);
      clay.r[i] = clay.rt[i] = 0.74 - 0.05 * s + 0.035 * Math.sin(s * Math.PI);
      clay.ridge[i] = 0;
    }
    clay.t = 0.2; clay.off = 0;
    clay.V = surfaceArea(clay.H, clay.r) * clay.t;   // 粘土の量。以後これを保つ（のばすと薄くなる）
  }
  resetClay();

  /* =====================================================================
     three.js の舞台
     ===================================================================== */
  const canvas = $('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  const PIXEL_RATIO = FAST ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 60);

  const hemi = new THREE.HemisphereLight(0xfff6ea, 0xb7a591, 0.82); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfffaf2, 0.95);
  key.position.set(-3.2, 6.2, 3.4);
  key.castShadow = true;
  key.shadow.mapSize.set(FAST ? 512 : 2048, FAST ? 512 : 2048);
  key.shadow.camera.left = -3.2; key.shadow.camera.right = 3.2;
  key.shadow.camera.top = 3.6;   key.shadow.camera.bottom = -3.2;
  key.shadow.camera.near = 1;    key.shadow.camera.far = 16;
  key.shadow.bias = -0.0006; key.shadow.normalBias = 0.03; key.shadow.radius = 5;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffe2c4, 0.28); fill.position.set(4, 2.2, 2.5); scene.add(fill);
  const fireBack = new THREE.PointLight(0xff6a1a, 0, 14, 1.6); fireBack.position.set(0, 0.5, -2.6); scene.add(fireBack);
  const fireFront = new THREE.PointLight(0xff8a3a, 0, 12, 1.6); fireFront.position.set(1.2, -0.1, 3.0); scene.add(fireFront);

  /* ---- 映り込み用の空（やわらかい光の箱）。釉薬のつやはこれが映って見える ---- */
  (function makeEnvironment() {
    const c = document.createElement('canvas'); c.width = 512; c.height = 256;
    const g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, 256);
    sky.addColorStop(0, '#8f8a84'); sky.addColorStop(0.4, '#6b655e'); sky.addColorStop(0.56, '#4a443e'); sky.addColorStop(1, '#2c2824');
    g.fillStyle = sky; g.fillRect(0, 0, 512, 256);
    const win = (x, y, w, h, a) => {                       // 窓あかり
      const grd = g.createRadialGradient(x, y, 0, x, y, w);
      grd.addColorStop(0, 'rgba(255,255,255,' + a + ')'); grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.save(); g.translate(x, y); g.scale(1, h / w); g.translate(-x, -y); g.fillStyle = grd; g.fillRect(x - w, y - w, w * 2, w * 2); g.restore();
    };
    win(120, 66, 80, 52, 1); win(120, 66, 40, 26, 1); win(384, 58, 52, 64, 0.9); win(250, 16, 150, 26, 0.6);
    const tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping; tex.encoding = THREE.sRGBEncoding;
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(tex).texture;
    tex.dispose(); pm.dispose();
  })();

  /* ---- 質感（すべてその場で描く。画像ファイルは使わない） ---- */
  const clayCanvas = document.createElement('canvas'); clayCanvas.width = 1024; clayCanvas.height = 512;
  (function paintClay() {
    const c = clayCanvas, g = c.getContext('2d'), rnd = seeded(7);
    g.fillStyle = '#a8927c'; g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < 40; i++) {                       // 周方向のむら（回転が見える）
      const x = rnd() * c.width, y = rnd() * c.height, w = 50 + rnd() * 170, h = 70 + rnd() * 240, dark = rnd() > 0.5;
      for (const ox of [-c.width, 0, c.width]) {
        const grd = g.createRadialGradient(0, 0, 0, 0, 0, 1);
        grd.addColorStop(0, dark ? 'rgba(92,74,58,.26)' : 'rgba(220,206,188,.24)');
        grd.addColorStop(1, dark ? 'rgba(92,74,58,0)' : 'rgba(220,206,188,0)');
        g.save(); g.translate(x + ox, y); g.scale(w, h); g.fillStyle = grd; g.fillRect(-1, -1, 2, 2); g.restore();
      }
    }
    for (let i = 0; i < 16; i++) {                       // 泥水のたれ
      const x = rnd() * c.width, y = rnd() * c.height * 0.7, len = 60 + rnd() * 200, w = 3 + rnd() * 9;
      const grd = g.createLinearGradient(0, y, 0, y + len);
      grd.addColorStop(0, 'rgba(206,190,170,0)'); grd.addColorStop(0.3, 'rgba(206,190,170,.3)'); grd.addColorStop(1, 'rgba(206,190,170,0)');
      g.fillStyle = grd; g.fillRect(x, y, w, len);
    }
    for (let i = 0; i < 260; i++) {                      // ろくろ目
      const y = rnd() * c.height;
      g.strokeStyle = rnd() > 0.5 ? 'rgba(70,56,44,' + (0.04 + rnd() * 0.09) + ')' : 'rgba(232,220,204,' + (0.04 + rnd() * 0.08) + ')';
      g.lineWidth = 0.6 + rnd() * 1.8;
      g.beginPath(); g.moveTo(0, y); g.lineTo(c.width, y); g.stroke();
    }
    for (let i = 0; i < 900; i++) {
      g.fillStyle = 'rgba(80,64,50,' + (rnd() * 0.08) + ')';
      g.fillRect(rnd() * c.width, rnd() * c.height, 1 + rnd() * 2, 1 + rnd() * 2);
    }
  })();
  const clayTex = new THREE.CanvasTexture(clayCanvas);
  clayTex.wrapS = THREE.RepeatWrapping; clayTex.encoding = THREE.sRGBEncoding; clayTex.anisotropy = 4;

  function makeWheelTexture() {
    const S = 1024, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), rnd = seeded(23), m = S / 2;
    g.fillStyle = '#cfc7bb'; g.fillRect(0, 0, S, S);
    for (let r = 4; r < m; r += 2 + rnd() * 5) {
      g.strokeStyle = rnd() > 0.5 ? 'rgba(255,255,255,' + (0.05 + rnd() * 0.12) + ')' : 'rgba(90,80,70,' + (0.04 + rnd() * 0.1) + ')';
      g.lineWidth = 0.6 + rnd() * 1.4;
      g.beginPath(); g.arc(m, m, r, 0, Math.PI * 2); g.stroke();
    }
    for (let i = 0; i < 26; i++) {
      const a0 = rnd() * Math.PI * 2, len = 0.3 + rnd() * 1.6, r = m * (0.25 + rnd() * 0.7);
      g.strokeStyle = 'rgba(150,128,106,' + (0.12 + rnd() * 0.28) + ')';
      g.lineWidth = 3 + rnd() * 16; g.lineCap = 'round';
      g.beginPath(); g.arc(m, m, r, a0, a0 + len); g.stroke();
    }
    for (let i = 0; i < 60; i++) {
      const a = rnd() * Math.PI * 2, r = m * (0.3 + rnd() * 0.68), s = 2 + rnd() * 9;
      g.fillStyle = 'rgba(140,118,98,' + (0.15 + rnd() * 0.3) + ')';
      g.beginPath(); g.ellipse(m + Math.cos(a) * r, m + Math.sin(a) * r, s, s * (0.5 + rnd() * 0.5), a, 0, Math.PI * 2); g.fill();
    }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    return t;
  }

  /* ---- 台。tilt（傾き）> spin（回転）> 器 の入れ子 ---- */
  const tilt = new THREE.Group(); scene.add(tilt);
  const spin = new THREE.Group(); tilt.add(spin);

  const wheelTop = new THREE.MeshStandardMaterial({ map: makeWheelTexture(), roughness: 0.48, metalness: 0.25, envMapIntensity: 0.5 });
  const wheelSide = new THREE.MeshStandardMaterial({ color: 0xb9b0a3, roughness: 0.4, metalness: 0.4, envMapIntensity: 0.5 });
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.1, 128), [wheelSide, wheelTop, wheelSide]);
  wheel.position.y = -0.05; wheel.receiveShadow = true; wheel.castShadow = true;
  spin.add(wheel);
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.4, 0.5, 64),
    new THREE.MeshStandardMaterial({ color: 0x8e8478, roughness: 0.7, metalness: 0.1, envMapIntensity: 0.4 }));
  pedestal.position.y = -0.35; pedestal.castShadow = true; tilt.add(pedestal);

  // 窯の棚板、兼、できあがりを置く台
  const slab = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.75, 0.08, 96),
    new THREE.MeshStandardMaterial({ color: new THREE.Color(0x4a3a2c).convertSRGBToLinear(), roughness: 0.74, metalness: 0, envMapIntensity: 0.35 }));
  slab.position.y = -0.04; slab.receiveShadow = true; slab.castShadow = true; slab.visible = false; scene.add(slab);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.6; ground.receiveShadow = true; scene.add(ground);

  /* ---- 器 ---- */
  const potMat = new THREE.MeshStandardMaterial({
    map: clayTex, bumpMap: clayTex, bumpScale: 0.006, roughness: 0.6, metalness: 0, side: THREE.DoubleSide,
    vertexColors: true, envMapIntensity: 0.6, emissive: 0x000000
  });
  const pot = new THREE.Mesh(new THREE.BufferGeometry(), potMat);
  pot.castShadow = true; pot.receiveShadow = true;
  spin.add(pot);

      if (h) { mode = 'pour'; pouring = { id: ev.pointerId, x: ev.clientX, y: ev.clientY }; showFinger(ev.clientX, ev.clientY); }
      else { mode = 'lean'; viewStart = { x: ev.clientX, y: ev.clientY }; }

  canvas.addEventListener('pointermove', ev => {
    if (!touches.has(ev.pointerId)) return;

    if (mode === 'pinch' && touches.size >= 2) {

      view.zoom = clamp(pinch.zoom * m.dist / pinch.dist, ZOOM_MIN, ZOOM_MAX);
      view.pitch = clamp(pinch.pitch + (m.cy - pinch.cy) * 0.25, PITCH_MIN, PITCH_MAX);

    } else if (mode === 'shape' && contact && ev.pointerId === contact.id) {

      clay.Ht = clamp(clay.Ht + dyW * 0.6 * (0.3 + 0.7 * c.y / clay.H), H_MIN, H_MAX);     // 上下：のびる・ちぢむ
      const ax = axisScreenX(c.y);
      const toward = (Math.abs(c.x - ax) - Math.abs(ev.clientX - ax)) * wpp;

  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', ev => {

  const COARSE = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);

  /* ---- 傾きセンサーとマイク（どちらも、使えなければドラッグ・長押しで代わりになる） ---- */
  async function initTilt() {
    if (sensor.ok || !('DeviceOrientationEvent' in window)) return;
    try {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {       // iPhone はここで許可の確認が出る
        if ((await DeviceOrientationEvent.requestPermission()) !== 'granted') return;
      }
      window.addEventListener('deviceorientation', e => {
        if (e.beta === null || e.gamma === null) return;
        sensor.ok = true; sensor.beta = e.beta; sensor.gamma = e.gamma;
      });
    } catch (e) {}
  }
  async function initMic() {
    if (mic.ok || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !audio) return;
    try {
      // 雑音を消す機能は切る（息まで消されるため）。自分の出す音を拾わないよう、反響の打ち消しは入れる
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
      const src = audio.ctx.createMediaStreamSource(stream), an = audio.ctx.createAnalyser();
      an.fftSize = 1024; an.smoothingTimeConstant = 0.4; src.connect(an);
      mic.stream = stream; mic.an = an; mic.time = new Uint8Array(an.fftSize); mic.freq = new Uint8Array(an.frequencyBinCount);
      mic.hz = audio.ctx.sampleRate / an.fftSize; mic.ok = true;
    } catch (e) {}
  }
  function stopMic() {
    if (mic.stream) mic.stream.getTracks().forEach(t => t.stop());
    mic.ok = false; mic.stream = null; mic.an = null; mic.level = 0;
  }
  function readMic() {
    if (!mic.ok) return 0;
    mic.an.getByteTimeDomainData(mic.time); mic.an.getByteFrequencyData(mic.freq);
    let sum = 0; for (let i = 0; i < mic.time.length; i++) { const v = (mic.time[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / mic.time.length);
    let low = 0, all = 0;
    for (let i = 1; i < mic.freq.length; i++) { const hz = i * mic.hz; if (hz > 4000) break; all += mic.freq[i]; if (hz < 350) low += mic.freq[i]; }
    const lowRatio = all ? low / all : 0;
    // 息は「大きいのに低い雑音が多い」。声でも弱く反応する
    return clamp((rms - 0.035) * 6, 0, 1) * (0.55 + 0.45 * clamp((lowRatio - 0.15) / 0.3, 0, 1));
  }

  /* =====================================================================
     音 ―― すべてその場で合成
     ===================================================================== */
  let audio = null, soundOn = true;
  function ensureAudio() {
    if (audio) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const ctx = new AC();
      const master = ctx.createGain(); master.gain.value = soundOn ? 0.9 : 0; master.connect(ctx.destination);
      const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2 + w * 0.08; }
      const loop = (type, freq, q) => {
        const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
        const g = ctx.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(master); s.start(Math.random());
        return { f, g };
      };
      const hum = ctx.createOscillator(); hum.type = 'sine'; hum.frequency.value = 52;
      const humG = ctx.createGain(); humG.gain.value = 0; hum.connect(humG); humG.connect(master); hum.start();
      audio = { ctx, master, buf, humG, whir: loop('lowpass', 220), rub: loop('bandpass', 720, 0.7), pour: loop('bandpass', 2400, 0.5), roar: loop('lowpass', 380), hiss: loop('bandpass', 1500, 0.4) };

  }
  function setGain(node, v, t) { if (audio) node.gain.setTargetAtTime(v, audio.ctx.currentTime, t || 0.08); }
  function crackle() {
    if (!audio || !soundOn) return;
    const ctx = audio.ctx, s = ctx.createBufferSource(); s.buffer = audio.buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800 + Math.random() * 2500;
    const g = ctx.createGain(), t = ctx.currentTime; g.gain.setValueAtTime(0.25 + Math.random() * 0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(audio.master); s.start(t, Math.random() * 1.5, 0.06);
  }
  function ping() {                                         // 焼きあがった器を指ではじいた音
    if (!audio || !soundOn) return;
    const ctx = audio.ctx, t = ctx.currentTime;

    });
  }
  $('btnSound').addEventListener('click', () => {

  const STEP = { shape: '一　形をつくる', glaze: '二　釉薬をかける', kiln: '三　焼く', cool: '三　焼く', done: '四　できあがり' };

    potMat.map = clayTex; potMat.roughnessMap = null; potMat.roughness = 0.6; potMat.bumpScale = 0.006; potMat.envMapIntensity = 0.6;

            '<span class="view">余白を上下になぞると、のぞき込める</span><span class="view">' + (COARSE ? '2本指でつまむと、拡大・縮小' : 'ホイールで拡大・縮小') + '</span>');

  function shapeName() {
    let maxR = 0; for (let i = 0; i < N; i++) maxR = Math.max(maxR, clay.r[i]);
    const D = maxR * 2, ratio = clay.H / D, neck = clay.r[N - 1] / maxR;

  function glazeName() {

  /* =====================================================================
     画像を保存 ―― 作品札つきの一枚に仕立てる
     ===================================================================== */
  function saveImage() {
    const W = 1080, H = 1350;
    renderer.setPixelRatio(1); renderer.setSize(W, H, false);
    placeCamera(W / H, true); renderer.render(scene, camera);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const bg = g.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.38, H * 0.95);
    bg.addColorStop(0, '#fbf8f2'); bg.addColorStop(0.45, '#f4eee5'); bg.addColorStop(1, '#e0d5c6');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.drawImage(renderer.domElement, 0, 0, W, H);
    const mincho = '"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif';
    const spaced = (text, x, y, sp) => { for (const ch of text) { g.fillText(ch, x, y); x += g.measureText(ch).width + sp; } };
    g.fillStyle = '#2e2823'; g.textBaseline = 'alphabetic';
    g.font = '700 34px ' + mincho; spaced('ろくろ', 64, 96, 8);
    g.font = '700 46px ' + mincho; spaced(caption.name, 64, H - 190, 8);
    g.globalAlpha = 0.5; g.fillRect(64, H - 160, 44, 1.5); g.globalAlpha = 1;
    g.fillStyle = '#85786c'; g.font = '500 24px ' + mincho;
    spaced(caption.spec1, 64, H - 110, 3); spaced(caption.spec2, 64, H - 70, 3);
    renderer.setPixelRatio(PIXEL_RATIO); placeCamera();

    const url = c.toDataURL('image/png');
    const bin = atob(url.split(',')[1]), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const d = new Date(), name = 'rokuro-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '.png';
    window.__lastImage = url;
    try {
      const file = new File([arr], name, { type: 'image/png' });
      if (COARSE && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'ろくろ' }).catch(() => {}); return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: 'image/png' })); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast('画像を保存しました', 1600);
    } catch (e) { toast('この画面では保存できませんでした', 2200); }
  }

  /* =====================================================================
     炎（窯の奥でゆれる光）
     ===================================================================== */
  const fireCanvas = $('fire'), fx = fireCanvas.getContext('2d'), sparks = [];
  function drawFire(dt, heat, blow) {
    const W = fireCanvas.width, H = fireCanvas.height;
    const want = (14 + 90 * heat + 90 * blow) * dt;
    for (let n = want + Math.random(); n >= 1; n--) {
      if (sparks.length > 220) break;
      sparks.push({ x: W * (0.5 + (Math.random() - 0.5) * (1.0 - 0.2 * heat)), y: H * (0.72 + Math.random() * 0.34), vx: (Math.random() - 0.5) * 14,
                    vy: -(26 + Math.random() * 70) * (0.5 + heat + blow * 0.8), age: 0, life: 0.8 + Math.random() * 1.1, s: (9 + Math.random() * 16) * (0.6 + 0.7 * heat) });
    }
    fx.globalCompositeOperation = 'source-over'; fx.clearRect(0, 0, W, H);
    fx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.age += dt; if (p.age > p.life) { sparks.splice(i, 1); continue; }
      p.x += (p.vx + Math.sin(p.age * 7 + i) * 8) * dt; p.y += p.vy * dt;
      const t = p.age / p.life, a = Math.sin(Math.PI * Math.min(1, t * 1.15)) * 0.16;
      const col = t < 0.25 ? '255,190,96' : t < 0.6 ? '255,112,28' : '170,34,10';
      const grd = fx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s);
      grd.addColorStop(0, 'rgba(' + col + ',' + a + ')'); grd.addColorStop(1, 'rgba(' + col + ',0)');
      fx.fillStyle = grd; fx.fillRect(p.x - p.s, p.y - p.s, p.s * 2, p.s * 2);
    }
  }
  function heatColor(T, out) {                              // 温度で器が赤く光る
    const k = clamp((T - 520) / 900, 0, 1);
    out.setRGB(lerp(0.0, 1.0, smoothstep(0, 0.4, k)), lerp(0.0, 0.42, smoothstep(0.25, 1, k)), lerp(0.0, 0.12, smoothstep(0.7, 1, k)));
    return k;
  }

  /* =====================================================================
     画面合わせと、毎フレームの更新
     ===================================================================== */
  let viewH = 1.9;
  function placeCamera(aspect, card) {
    const w = window.innerWidth, h = window.innerHeight;
    if (!aspect) { renderer.setSize(w, h, false); aspect = w / h; }
    camera.aspect = aspect;
    const halfV = viewH * 0.62 + 0.35, halfW = aspect < 1 ? 1.55 : 2.0;
    const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const d = camDist = Math.max(halfV / tan, halfW / (tan * aspect)) / (card ? 0.95 : view.zoom);
    const cy = viewH * (card ? 0.2 : 0.3), pitch = THREE.MathUtils.degToRad(view.pitch);
    camera.position.set(0, cy + Math.sin(pitch) * d, Math.cos(pitch) * d);
    camera.lookAt(0, cy, 0);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', () => placeCamera());
  placeCamera();

  let prev = performance.now(), lightMix = 0, compClock = 0;
  const glowEl = $('glow'), tmpCol = new THREE.Color();
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    let camMoved = false;

    /* ---- 形をつくる ---- */
    if (stage === 'shape' || stage === 'intro') {
      if (contact) { press(dt); wet = 1; }
      let moved = false;
      const kH = Math.min(1, dt * 7), kR = Math.min(1, dt * 9);
      if (Math.abs(clay.Ht - clay.H) > 0.0005) { clay.H += (clay.Ht - clay.H) * kH; moved = true; }
      for (let i = 0; i < N; i++) { const d = clay.rt[i] - clay.r[i]; if (Math.abs(d) > 0.0004) { clay.r[i] += d * kR; moved = true; } }
      if (moved || contact) rebuild();
      slumpCool = Math.max(0, slumpCool - dt);
      const tRaw = clay.V / surfaceArea(clay.H, clay.r);
      if (slumpCool === 0 && (tRaw < T_SLUMP || (clay.off > 0.85 && tRaw < 0.085))) slump();
      const thin = 1 - clamp((tRaw - T_SLUMP) / 0.1, 0, 1);
      const wob = 0.002 + 0.02 * thin * clamp(clay.H / 2, 0, 1) + 0.075 * clay.off;      // 芯のぶれ
      pot.position.x = wob; pot.rotation.z = -wob * 1.1;
      wet = Math.max(0, wet - dt * 0.5);
      potMat.roughness = 0.62 - 0.26 * wet; potMat.envMapIntensity = 0.55 + 0.6 * wet;   // ふれている間は濡れてつやが出る
    } else {
      pot.position.x += (0 - pot.position.x) * Math.min(1, dt * 3);                      // 手を離したら芯は落ち着く（かたむきは少し残る）
      pot.rotation.z += (-0.02 * clay.off - pot.rotation.z) * Math.min(1, dt * 3);
    }

    /* ---- 釉薬 ---- */
    if (stage === 'glaze') {
      let sx = 0, sz = 0;
      if (sensor.ok) {
        if (!sensor.base) sensor.base = { b: sensor.beta, g: sensor.gamma };
        sx = clamp((sensor.gamma - sensor.base.g) / 30, -1, 1); sz = clamp((sensor.beta - sensor.base.b) / 30, -1, 1);
        if (Math.abs(sx) + Math.abs(sz) > 0.5 && hintCount < 3) countHint(3);
      }
      const tx = clamp(sx + lean.dragX, -1, 1), tz = clamp(sz + lean.dragZ, -1, 1), k = Math.min(1, dt * 8);
      lean.x += (tx - lean.x) * k; lean.z += (tz - lean.z) * k;
      if (pouring) {
        const h = hitPot(pouring.x, pouring.y);
        if (h) {
          const uf = h.u * GW;
          if (h.kind === 'out') pourAt(uf, (1 - (h.j - 1) / (N - 1)) * (GH - 1), dt); else pourInside(uf, dt);
        }
      }
      if (glazeWet) {
        const c = Math.cos(angle), s = Math.sin(angle);           // 傾きを、回っている器から見た向きに直す
        stepGlaze(dt, lean.x * c - lean.z * s, lean.x * s + lean.z * c, 1);
      }
      if (glazeDirty) composite();
    }
    tilt.rotation.z += (-lean.x * 0.3 - tilt.rotation.z) * Math.min(1, dt * 10);
    tilt.rotation.x += (lean.z * 0.3 - tilt.rotation.x) * Math.min(1, dt * 10);

    /* ---- 焼く・冷ます ---- */
    const inKiln = stage === 'kiln', cooling = stage === 'cool';
    if (inKiln) {
      kiln.t += dt;
      const b = Math.max(blowPress ? 0.85 : 0, readMic());
      kiln.blow += (b - kiln.blow) * Math.min(1, dt * (b > kiln.blow ? 6 : 2.5));
      if (kiln.blow > 0.3 && hintCount < 3 && kiln.t > 1) { hintCount += dt * 0.8; if (hintCount >= 3) $('hint').classList.add('gone'); }
      const target = 780 + 660 * kiln.blow;
      kiln.T += (target - kiln.T) * dt * (target > kiln.T ? 0.32 : 0.11);
      fired.peak = Math.max(fired.peak, kiln.T); fired.blow += kiln.blow * dt;
      if (kiln.T > 1100) fired.soak += dt;
      const m = clamp(fired.soak / 5, 0, 1) * smoothstep(1050, 1200, fired.peak);
      if (kiln.T > 1220) {                                           // 熱で釉薬がふたたび動く
        const mob = clamp((kiln.T - 1220) / 180, 0, 1) * 0.5;
        for (let k = 0; k < GN; k += 1) if (gA[k] > 0.2 && gWet[k] < mob) gWet[k] = mob;
        stepGlaze(dt, 0, 0, mob);
      }
      compClock += dt;
      if (Math.abs(m - fired.m) > 0.03 || (glazeDirty && compClock > 0.25)) { fired.m = m; composite(); compClock = 0; }
      $('tempNum').textContent = Math.round(kiln.T / 5) * 5;
      $('tempWord').textContent = kiln.T < 600 ? 'あぶり'
        : kiln.T > 1300 ? '強い火。釉薬が流れだす'
        : m >= 0.95 ? 'よく溶けた。出しどき'
        : kiln.T >= 1100 ? '釉薬が溶けていく'
        : fired.soak > 0 ? '火が弱まっている' : (mic.ok ? '息を吹いて、温度を上げる' : '長押しで風を送って、温度を上げる');
      if (kiln.T > 600) $('btnNext').classList.remove('fadeout');
      if (Math.random() < dt * (2 + 10 * kiln.heat + 14 * kiln.blow)) crackle();
    }
    if (cooling) {
      coolT += dt;
      kiln.blow = 0; kiln.T += (20 - kiln.T) * dt * 1.5;
      $('tempNum').textContent = Math.round(kiln.T / 5) * 5; $('tempWord').textContent = '冷ます';
      if (coolT > 3.4) startDone();
    }
    kiln.heat = (inKiln || cooling) ? clamp((kiln.T - 250) / 1000, 0, 1) : 0;
    const flick = 0.82 + 0.18 * Math.sin(now * 0.013) * Math.sin(now * 0.0071 + 1.3) + (Math.random() - 0.5) * 0.06;
    lightMix += ((inKiln ? 1 : 0) - lightMix) * Math.min(1, dt * (inKiln ? 4 : 1.1));
    hemi.intensity = lerp(0.82, 0.07, lightMix); key.intensity = lerp(0.95, 0.06, lightMix); fill.intensity = lerp(0.28, 0, lightMix);
    fireBack.intensity = kiln.heat * flick * 1.5 * lightMix; fireFront.intensity = (0.3 + 0.7 * kiln.heat) * flick * 0.34 * lightMix;
    if (inKiln || cooling) {
      const k = heatColor(kiln.T, tmpCol);
      potMat.emissive.copy(tmpCol); potMat.emissiveIntensity = 0.42 * k;
      potMat.envMapIntensity = lerp(1.25, 0.15, lightMix);
      slab.material.emissive.copy(tmpCol); slab.material.emissiveIntensity = 0.08 * k;
      drawFire(dt, kiln.heat * lightMix, kiln.blow);
      fireCanvas.style.opacity = (0.3 + 0.6 * kiln.heat) * lightMix;
      glowEl.style.opacity = clamp((0.12 + 0.4 * kiln.heat + 0.15 * kiln.blow) * flick * lightMix, 0, 1);
    } else if (fireCanvas.style.opacity !== '0') {
      fireCanvas.style.opacity = '0'; glowEl.style.opacity = '0';
      potMat.emissiveIntensity = 0; slab.material.emissiveIntensity = 0;
    }

    /* ---- 回転 ---- */
    if (stage === 'done') {
      if (!turn.drag) { turn.vel += (0.3 - turn.vel) * Math.min(1, dt * 0.8); angle += turn.vel * dt; }
    } else angle += dt * spinSpeed;
    spin.rotation.y = angle;

    /* ---- カメラ ---- */
    const target = Math.max(1.9, clay.H + 0.75);
    if (Math.abs(target - viewH) > 0.002) { viewH += (target - viewH) * Math.min(1, dt * 2.2); camMoved = true; }
    if (view.to) {
      const k = Math.min(1, dt * 2.4);
      view.pitch += (view.to.pitch - view.pitch) * k; view.zoom += (view.to.zoom - view.zoom) * k; camMoved = true;
      if (Math.abs(view.to.pitch - view.pitch) < 0.05 && Math.abs(view.to.zoom - view.zoom) < 0.002) view.to = null;
    }
    if (camMoved) placeCamera();

    /* ---- 音 ---- */
    if (audio) {
      const shaping = stage === 'shape' || stage === 'intro';
      friction = Math.max(contact ? 0.38 : 0, friction - dt * 4.5);
      setGain(audio.humG, shaping ? 0.05 : 0, 0.4); setGain(audio.whir.g, shaping ? 0.16 : stage === 'glaze' ? 0.03 : 0, 0.4);
      setGain(audio.rub.g, shaping ? friction * 0.5 : 0, 0.04);
      audio.rub.f.frequency.setTargetAtTime(560 + friction * 520, audio.ctx.currentTime, 0.06);
      setGain(audio.pour.g, pouring ? 0.14 : glazeWet && stage === 'glaze' ? 0.025 : 0, 0.12);
      setGain(audio.roar.g, inKiln ? 0.12 + 0.3 * kiln.heat + 0.28 * kiln.blow : cooling ? 0.1 * kiln.heat : 0, 0.15);
      audio.roar.f.frequency.setTargetAtTime(280 + 500 * kiln.blow, audio.ctx.currentTime, 0.1);
      setGain(audio.hiss.g, inKiln ? 0.05 * kiln.heat + 0.22 * kiln.blow : 0, 0.1);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 動作確認用（開発者ツールから状態を読めるようにしておく）
  window.__rokuro = { clay, view, kiln, fired, lean, sensor, mic, used, inner, get stage() { return stage; },
    startShape, startGlaze, startKiln, startCool, startDone, saveImage, slump, pourAt, pourInside, composite, stepGlaze,
    glaze: { gA, gWet, GW, GH, select: i => { glazeSel = i; } }, setBlow: v => { blowPress = v; } };
})();
</script>
</body>
</html>
