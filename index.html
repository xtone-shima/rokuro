<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4eee5">
<title>ろくろ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#2e2823; --sub:#85786c; --paper:#f4eee5; --paper-deep:#e0d5c6; --line:rgba(46,40,35,.16);
    --chip:rgba(255,255,255,.55); --btn:#2e2823; --btn-ink:#f7f1e8;
    --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --sans:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
  }
  body.dark { --ink:#f6e9d8; --sub:#c9a98a; --line:rgba(246,233,216,.22); --chip:rgba(60,28,14,.5); --btn:#f6e9d8; --btn-ink:#2a140b; }
  body.dark .temp, body.dark .hint, body.dark .head { text-shadow:0 1px 10px rgba(10,4,2,.85), 0 0 2px rgba(10,4,2,.7); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink);
               font-family:var(--sans); -webkit-user-select:none; user-select:none; overscroll-behavior:none; -webkit-touch-callout:none; }
  .bg { position:fixed; inset:0; }
  .bg.paper { background:radial-gradient(120% 90% at 50% 38%, #fbf8f2 0%, var(--paper) 45%, var(--paper-deep) 100%); }
  .bg.kiln { background:radial-gradient(90% 70% at 50% 88%, #7a2a0a 0%, #3a1407 38%, #150a06 72%, #0a0605 100%); opacity:0; transition:opacity 1.4s ease; }
  .bg.glow { background:radial-gradient(70% 55% at 50% 92%, rgba(255,120,30,.8) 0%, rgba(230,70,10,.3) 45%, rgba(200,40,0,0) 75%); opacity:0; mix-blend-mode:screen; }
  body.kilnbg .bg.kiln { opacity:1; }
  canvas#fire { position:fixed; left:0; bottom:0; width:100%; height:66%; transform-origin:50% 100%; opacity:0; filter:blur(14px) saturate(1.25); pointer-events:none; }
  canvas#stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas#stage.touching { cursor:grabbing; }

  .head { position:fixed; left:22px; top:calc(18px + var(--safe-t)); pointer-events:none; transition:color .8s; }
  .head h1 { margin:0; font-family:var(--mincho); font-weight:700; font-size:24px; letter-spacing:.18em; }
  .head .step { margin-top:6px; font-family:var(--mincho); font-size:13px; letter-spacing:.2em; color:var(--sub); transition:color .8s; }

  .size { margin-top:10px; font-family:var(--mincho); font-size:13px; letter-spacing:.1em; color:var(--ink); font-variant-numeric:tabular-nums; display:none; }
  .size b { font-size:17px; font-weight:700; margin:0 1px 0 5px; }
  body.s-shape .size { display:block; }
  .wheelBtn { position:fixed; left:20px; top:calc(116px + var(--safe-t)); display:none; font-family:var(--mincho); letter-spacing:.12em; padding:9px 14px; }
  body.s-shape .wheelBtn { display:block; }
  .help { position:fixed; right:16px; bottom:calc(26px + var(--safe-b)); display:none; font-family:var(--mincho); letter-spacing:.12em; padding:9px 13px; }
  body.s-shape .help, body.s-glaze .help, body.s-kiln .help { display:block; }
  .pad { position:fixed; left:16px; bottom:calc(16px + var(--safe-b)); width:64px; height:64px; border-radius:50%; border:1px solid var(--line); background:var(--chip);
         -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); display:none; touch-action:none; cursor:grab; }
  .pad.on { display:block; }
  .pad i { position:absolute; left:50%; top:50%; z-index:1; width:26px; height:26px; margin:-13px; border-radius:50%; background:var(--ink); box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .pad::before, .pad::after { content:""; position:absolute; background:var(--line); }
  .pad::before { left:50%; top:10px; bottom:10px; width:1px; } .pad::after { top:50%; left:10px; right:10px; height:1px; }
  canvas#embers { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  .tools { position:fixed; right:16px; top:calc(16px + var(--safe-t)); display:flex; gap:8px; z-index:11; align-items:center; }
  .chip { font:500 12px var(--sans); letter-spacing:.08em; color:var(--ink); background:var(--chip);
          border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer;
          -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); transition:color .8s, background .8s, border-color .8s; }
  .chip:active { filter:brightness(1.15); }
  .chip.icon { width:40px; height:40px; padding:0; display:inline-flex; align-items:center; justify-content:center; }
  .chip.icon .mute { display:none; }
  .chip.icon.off .waves { display:none; } .chip.icon.off .mute { display:inline; } .chip.icon.off { color:var(--sub); }
  body.s-intro #btnReset { display:none; }

  .temp { position:fixed; left:0; right:0; top:calc(74px + var(--safe-t)); text-align:center; pointer-events:none;
          font-family:var(--mincho); color:var(--ink); opacity:0; transition:opacity .8s; }
  .temp b { font-weight:500; font-size:44px; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  .temp span { font-size:16px; margin-left:4px; color:var(--sub); }
  .temp em { font-style:normal; }
  .temp small { display:block; margin-top:2px; font-size:12px; letter-spacing:.3em; color:var(--sub); min-height:1.4em; }
  body.s-kiln .temp { opacity:1; }

  .dock { position:fixed; left:0; right:0; bottom:calc(20px + var(--safe-b)); display:flex; flex-direction:column; align-items:center; gap:14px;
          pointer-events:none; padding:0 16px; }
  .dock > * { pointer-events:auto; }
  .hint { pointer-events:none; text-align:center; font-family:var(--mincho); font-size:14px; letter-spacing:.12em; line-height:1.95;
          color:var(--ink); transition:opacity .8s, color .8s; max-width:34em; }
  .hint.gone { opacity:0; }
  .hint span { display:inline-block; padding:0 .5em; }
  .hint .view { font-size:12px; color:var(--sub); }

  .swatches { display:none; gap:10px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
  body.s-glaze .swatches { display:flex; }
  .sw { width:52px; background:none; border:0; padding:0; cursor:pointer; font-family:var(--mincho); color:var(--sub); font-size:11px; letter-spacing:.1em; text-align:center; }
  .sw i { display:block; width:38px; height:38px; margin:0 auto 5px; border-radius:50%; border:1px solid rgba(46,40,35,.2);
          box-shadow:inset 0 -6px 10px rgba(0,0,0,.18), inset 0 5px 8px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.12); transition:transform .2s; }
  .sw.on { color:var(--ink); font-weight:700; }
  .sw.on i { transform:scale(1.16); box-shadow:inset 0 -6px 10px rgba(0,0,0,.18), inset 0 5px 8px rgba(255,255,255,.35), 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }

  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .next { font:700 15px var(--mincho); letter-spacing:.22em; color:var(--btn-ink); background:var(--btn); border:0; border-radius:999px;
          padding:14px 30px 14px 34px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.18); transition:opacity .5s, transform .15s, background .8s, color .8s; }
  .next:active { transform:scale(.97); }
  .next.ghost { background:var(--chip); color:var(--ink); border:1px solid var(--line); box-shadow:none; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .hide { display:none !important; }
  .fadeout { opacity:0; pointer-events:none !important; }

  .caption { position:fixed; left:24px; bottom:calc(128px + var(--safe-b)); pointer-events:none; opacity:0; transform:translateY(6px);
             transition:opacity 1.2s ease .4s, transform 1.2s ease .4s; font-family:var(--mincho); }
  body.s-done .caption { opacity:1; transform:none; }
  .caption .name { font-size:24px; font-weight:700; letter-spacing:.16em; }
  .caption .spec { margin-top:8px; font-size:12px; letter-spacing:.12em; color:var(--sub); line-height:1.9; font-variant-numeric:tabular-nums; }
  .caption .rule { width:28px; height:1px; background:var(--ink); margin:12px 0 0; opacity:.5; }

  .warn { position:fixed; left:50%; top:calc(66px + var(--safe-t)); transform:translate(-50%,-8px); opacity:0; pointer-events:none;
          font-family:var(--mincho); font-size:14px; letter-spacing:.14em; color:#fff; background:rgba(120,58,42,.92);
          padding:8px 18px; border-radius:999px; transition:opacity .25s, transform .25s; white-space:nowrap; }
  .warn.show { opacity:1; transform:translate(-50%,0); }

  .finger { position:fixed; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; pointer-events:none;
            border:1px solid rgba(46,40,35,.28); background:radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
            opacity:0; transition:opacity .2s; }
  .finger.on { opacity:1; }
  body.dark .finger { border-color:rgba(255,220,180,.4); background:radial-gradient(circle, rgba(255,190,120,.3), rgba(255,160,80,0) 70%); }

  /* 釉薬：そそがれる筋と、ふれる場所のしるし */
  .stream { position:fixed; width:12px; margin-left:-6px; border-radius:6px 6px 3px 3px; pointer-events:none; opacity:0; transition:opacity .15s;
            transform-origin:50% 100%; animation:pourw .5s ease-in-out infinite alternate; }
  .stream.on { opacity:.9; }
  @keyframes pourw { from { transform:scaleX(.8); } to { transform:scaleX(1.15); } }
  .target { position:fixed; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; pointer-events:none; opacity:0; transition:opacity .5s;
            border:1.5px solid var(--ink); }
  .target::after { content:""; position:absolute; inset:-1.5px; border-radius:50%; border:1.5px solid var(--ink); animation:ringp 1.6s ease-out infinite; }
  .target.on { opacity:.75; }
  @keyframes ringp { from { transform:scale(1); opacity:.8; } to { transform:scale(1.9); opacity:0; } }
  .phone { display:inline-block; width:15px; height:25px; border:1.5px solid var(--ink); border-radius:4px; vertical-align:-6px; margin-right:.7em;
           animation:rock 1.8s ease-in-out infinite; }
  @keyframes rock { 0%,100% { transform:rotate(-24deg); } 50% { transform:rotate(24deg); } }
  .hint b { font-weight:700; font-size:1.12em; }
  /* 窯：焼き加減の目安 */
  .scale { width:288px; max-width:calc(100vw - 40px); margin:12px auto 0; }
  .zones { position:relative; display:flex; gap:3px; height:6px; }
  .zones i { flex:1; border-radius:3px; opacity:.55; }
  .zones .z0 { background:#e9e0d2; flex:1.2; } .zones .z1 { background:#f2a53c; } .zones .z2 { background:#b8431a; }
  .zones b { position:absolute; top:-5px; width:2px; height:16px; margin-left:-1px; border-radius:1px; background:#fff; box-shadow:0 0 8px #ffd9a0; left:0; }
  .zl { display:flex; gap:3px; margin-top:7px; font-size:10.5px; letter-spacing:.02em; line-height:1.45; color:var(--sub); white-space:nowrap; }
  .zl span { flex:1; opacity:.6; } .zl span:first-child { flex:1.2; }
  .zl span.on { opacity:1; color:var(--ink); font-weight:700; }
  /* 窯：息の届き具合 */
  .meter { display:block; width:150px; height:4px; margin:12px auto 0; border-radius:2px; background:var(--line); overflow:hidden; }
  .meter b { display:block; height:100%; width:0; background:#ffb45a; border-radius:2px; box-shadow:0 0 10px #ff8a2a; }
  .meterLabel { display:block; margin-top:6px; font-size:11px; letter-spacing:.2em; color:var(--sub); }

  .intro { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
           background:rgba(244,238,229,.78); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); transition:opacity .9s ease; padding:24px; }
  .intro h2 { margin:0; font-family:var(--mincho); font-weight:700; font-size:54px; letter-spacing:.3em; text-indent:.3em; }
  .intro p { margin:26px 0 0; font-family:var(--mincho); font-size:16px; letter-spacing:.2em; line-height:2.1; }
  .intro p span { display:inline-block; }
  .intro .next { margin-top:34px; }
  .steps { list-style:none; margin:30px 0 0; padding:0; display:grid; grid-template-columns:repeat(4, 85px); gap:0; font-family:var(--mincho); font-size:11.5px; letter-spacing:.06em; color:var(--ink); }
  .steps li { position:relative; white-space:nowrap; text-align:center; }
  .steps li b { display:block; font-size:17px; font-weight:700; margin-bottom:6px; color:var(--sub); }
  .steps li + li::before { content:""; position:absolute; left:0; top:6px; width:1px; height:36px; background:var(--line); }
  .chip.icon.wide { width:auto; padding:0 16px 0 12px; gap:8px; margin-top:14px; font-family:var(--mincho); letter-spacing:.14em; }
  body.s-intro .tools { display:none; }
  .intro small { margin-top:22px; font-size:11px; letter-spacing:.1em; color:var(--sub); line-height:1.8; }

  .veil { position:fixed; inset:0; background:#0d0705; opacity:0; pointer-events:none; transition:opacity .55s ease; }
  .veil.on { opacity:1; }

  @media (max-width:560px) {
    .head h1 { font-size:21px; } .hint { font-size:13px; } .temp b { font-size:38px; }
    .caption { left:20px; bottom:calc(140px + var(--safe-b)); } .caption .name { font-size:21px; }
    .sw { width:46px; } .sw i { width:34px; height:34px; }
  }
</style>
</head>
<body class="s-intro">
<div class="bg paper"></div>
<div class="bg kiln"></div>
<canvas id="fire" width="120" height="180"></canvas>
<div class="bg glow" id="glow"></div>
<canvas id="stage"></canvas>

<div class="head">
  <h1>ろくろ</h1>
  <div class="step" id="step">一　形をつくる</div>
  <div class="size" id="size"></div>
</div>

<div class="tools">
  <button class="chip icon" id="btnSound" type="button" aria-label="音を切る" aria-pressed="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke-width="1.2"/>
      <g class="waves"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></g>
      <g class="mute"><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></g>
    </svg>
  </button>
  <button class="chip" id="btnReset" type="button">はじめから</button>
</div>

<div class="temp" id="temp"><b id="tempNum">20</b><span>℃</span><small id="tempWord"></small>
  <div class="scale" id="scale">
    <div class="zones"><i class="z0"></i><i class="z1"></i><i class="z2"></i><b id="scaleMark"></b></div>
    <div class="zl"><span>粉っぽい</span><span>ちょうど良い<br>色とツヤ</span><span>深い<br>色とツヤ</span></div>
  </div>
  <i class="meter"><b id="blowBar"></b></i><em class="meterLabel" id="blowLabel"></em></div>

<div class="caption" id="caption">
  <div class="name" id="capName"></div>
  <div class="rule"></div>
  <div class="spec" id="capSpec"></div>
</div>

<div class="dock">
  <div class="hint" id="hint"></div>
  <div class="swatches" id="swatches"></div>
  <div class="row">
    <button class="next ghost hide" id="btnAgain" type="button">もういちど</button>
    <button class="next" id="btnNext" type="button">釉薬をかける</button>
  </div>
</div>

<canvas id="embers"></canvas>
<button class="chip wheelBtn" id="btnWheel" type="button">■ 回転を止める</button>
<button class="chip help" id="btnHelp" type="button" aria-label="説明をもう一度見る">？ 説明</button>
<div class="pad" id="pad" aria-label="器を傾ける"><i id="padKnob"></i></div>
<div class="warn" id="warn">へたってしまった</div>
<div class="finger" id="finger"></div>
<div class="stream" id="stream"></div>
<div class="target" id="target"></div>
<div class="veil" id="veil"></div>

<div class="intro" id="intro">
  <h2>ろくろ</h2>
  <p><span>土をかたちにして、</span><span>釉薬をかけ、</span><span>火で焼く。</span></p>
  <ol class="steps">
    <li><b>一</b>形をつくる</li><li><b>二</b>釉薬をかける</li><li><b>三</b>焼く</li><li><b>四</b>できあがり</li>
  </ol>
  <button class="next" id="btnStart" type="button">はじめる</button>
  <small>スマートフォンでは、本体の傾きと、息を使います。<br>音が出ます。</small>
  <button class="chip icon wide" id="btnSoundIntro" type="button" aria-label="音を切る" aria-pressed="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke-width="1.2"/>
      <g class="waves"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></g>
      <g class="mute"><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></g>
    </svg>
    <span id="soundLabel">音あり</span>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const FAST = /[?&]fast\b/.test(location.search);          // 動作確認用：描画を軽くする
  function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  /* =====================================================================
     段階 ―― intro → shape（形）→ glaze（釉薬）→ kiln（焼く）→ cool（冷ます）→ done（できあがり）
     ===================================================================== */
  let stage = 'intro';
  function setStageClass(s) {
    document.body.className = document.body.className.replace(/\bs-\w+/g, '').trim() + ' s-' + s;
  }

  /* =====================================================================
     粘土の形 ―― 器を「高さごとの半径」の並びで持つ（回転体なのでこれで足りる）。1.0 = 10cm
     ===================================================================== */
  const N = 72;                 // 高さ方向の分割数
  const T_SLUMP = 0.04;         // 壁がこれより薄くなると、へたる
  const H_MIN = 0.3, H_MAX = 2.6, R_MIN = 0.1, R_MAX = 1.45;
  // r / H が「いまの形」、rt / Ht が「指が押して向かわせている形」。いまの形は少し遅れて追いかける（じわっと寄る）
  const clay = { H: 0, Ht: 0, r: new Float32Array(N), rt: new Float32Array(N), ridge: new Float32Array(N), V: 0, t: 0.2, off: 0 };

  function surfaceArea(H, r) {
    let a = Math.PI * r[0] * r[0];
    const dy = H / (N - 1);
    for (let i = 0; i < N - 1; i++) a += Math.PI * (r[i] + r[i + 1]) * Math.hypot(dy, r[i + 1] - r[i]);
    return a;
  }
  const DU = 128, dent = new Float32Array(DU * N);          // ＋はへこみ、－はふくらみ
  let dentAny = false;
  function stampDent(u01, i, amt, rad) {
    i = clamp(Math.round(i), 0, N - 1);
    const ru = Math.max(1.6, rad / Math.max(0.15, clay.r[i]) / (Math.PI * 2) * DU), ri = Math.max(1.6, rad / clay.H * (N - 1));
    const uc = u01 * DU, nu = Math.ceil(ru * 2.5), ni = Math.ceil(ri * 2.5);
    for (let di = -ni; di <= ni; di++) {
      const ii = i + di; if (ii < 1 || ii >= N) continue;                        // 底は台についているので動かさない
      for (let du = -nu; du <= nu; du++) {
        const uu = ((Math.round(uc) + du) % DU + DU) % DU, w = Math.exp(-((du * du) / (ru * ru) + (di * di) / (ri * ri)));
        dent[ii * DU + uu] = clamp(dent[ii * DU + uu] + amt * w, -0.07, 0.09);
      }
    }
    dentAny = true;
  }
  function resetClay() {
    clay.H = clay.Ht = 0.85;
    for (let i = 0; i < N; i++) {
      const s = i / (N - 1);
      clay.r[i] = clay.rt[i] = 0.74 - 0.05 * s + 0.035 * Math.sin(s * Math.PI);
      clay.ridge[i] = 0;
    }
    clay.t = 0.2; clay.off = 0; dent.fill(0); dentAny = false;
    clay.V = surfaceArea(clay.H, clay.r) * clay.t;   // 粘土の量。以後これを保つ（のばすと薄くなる）
  }
  resetClay();

  /* =====================================================================
     three.js の舞台
     ===================================================================== */
  const canvas = $('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  const PIXEL_RATIO = FAST ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(PIXEL_RATIO);

  function saveImage() {

    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const bg = g.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.38, H * 0.95);
    bg.addColorStop(0, '#fbf8f2'); bg.addColorStop(0.45, '#f4eee5'); bg.addColorStop(1, '#e0d5c6');

  /* =====================================================================
     炎（窯の奥でゆれる光）

  const fireCanvas = $('fire'), fx = fireCanvas.getContext('2d'), sparks = [];
  function drawFire(dt, heat, blow) {
    const W = fireCanvas.width, H = fireCanvas.height;
    const want = (14 + 90 * heat + 150 * blow) * dt;
    for (let n = want + Math.random(); n >= 1; n--) {
      if (sparks.length > 280) break;
      sparks.push({ x: W * (0.5 + (Math.random() - 0.5) * (1.0 - 0.2 * heat)), y: H * (0.72 + Math.random() * 0.34), vx: (Math.random() - 0.5) * 14,
                    vy: -(26 + Math.random() * 70) * (0.5 + heat + blow * 1.3), age: 0, life: 0.8 + Math.random() * 1.1, s: (9 + Math.random() * 16) * (0.6 + 0.7 * heat) * (1 + 0.3 * blow), b: blow });
    }
    fx.globalCompositeOperation = 'source-over'; fx.clearRect(0, 0, W, H);
    fx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.age += dt; if (p.age > p.life) { sparks.splice(i, 1); continue; }
      p.x += (p.vx + Math.sin(p.age * 7 + i) * 8) * dt; p.y += p.vy * dt;
      const t = p.age / p.life, a = Math.sin(Math.PI * Math.min(1, t * 1.15)) * (0.13 + 0.05 * p.b);
      const col = t < 0.25 ? '255,190,96' : t < 0.6 ? '255,112,28' : '170,34,10';
      const grd = fx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s);
      grd.addColorStop(0, 'rgba(' + col + ',' + a + ')'); grd.addColorStop(1, 'rgba(' + col + ',0)');
      fx.fillStyle = grd; fx.fillRect(p.x - p.s, p.y - p.s, p.s * 2, p.s * 2);
    }
  }
  // 火の粉：吹いた分だけ、手前に舞い上がる
  const emberCanvas = $('embers'), ex = emberCanvas.getContext('2d'), embers = [];
  function sizeEmbers() { emberCanvas.width = window.innerWidth; emberCanvas.height = window.innerHeight; }
  sizeEmbers(); window.addEventListener('resize', sizeEmbers);
  let embersDirty = false;
  function drawEmbers(dt, heat, blow, on) {
    const W = emberCanvas.width, H = emberCanvas.height;
    if (!on && !embers.length) { if (embersDirty) { ex.clearRect(0, 0, W, H); embersDirty = false; } return; }
    if (on) for (let n = (1.5 + 5 * heat + 110 * blow) * dt + Math.random(); n >= 1; n--) {
      if (embers.length > 260) break;
      embers.push({ x: W * Math.random(), y: H * (0.78 + Math.random() * 0.26), vx: (Math.random() - 0.5) * 90, vy: -(110 + Math.random() * 380) * (0.45 + 1.1 * blow),
                    age: 0, life: 0.7 + Math.random() * 1.2, s: 0.9 + Math.random() * 1.9, ph: Math.random() * 6 });
    }
    ex.globalCompositeOperation = 'source-over'; ex.clearRect(0, 0, W, H); ex.globalCompositeOperation = 'lighter'; embersDirty = true;
    for (let i = embers.length - 1; i >= 0; i--) {
      const p = embers[i]; p.age += dt; if (p.age > p.life || p.y < -20) { embers.splice(i, 1); continue; }
      p.vy *= 1 - dt * 0.5; p.x += (p.vx + Math.sin(p.age * 5 + p.ph) * 40) * dt; p.y += p.vy * dt;
      const t = p.age / p.life, a = (1 - t) * (0.6 + 0.4 * Math.sin(p.age * 30 + p.ph));

      ex.beginPath(); ex.arc(p.x, p.y, p.s * 3.4, 0, 6.3); ex.fill();
      ex.fillStyle = 'rgba(255,' + Math.round(240 - 90 * t) + ',' + Math.round(190 - 150 * t) + ',' + a + ')';
      ex.beginPath(); ex.arc(p.x, p.y, p.s, 0, 6.3); ex.fill();
    }
  }
  function heatColor(T, out) {                              // 温度で器が赤く光る

  /* =====================================================================

  let viewH = 1.9;
  function placeCamera(aspect, card) {
    const w = window.innerWidth, h = window.innerHeight;
    if (!aspect) { renderer.setSize(w, h, false); aspect = w / h; }
    camera.aspect = aspect;
    const halfV = viewH * 0.62 + 0.35, halfW = aspect < 1 ? 1.55 : 2.0;
    const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const d = camDist = Math.max(halfV / tan, halfW / (tan * aspect)) / (card ? 0.95 : view.zoom);
    const cy = viewH * (card ? 0.2 : 0.3), pitch = THREE.MathUtils.degToRad(view.pitch);
    camera.position.set(0, cy + Math.sin(pitch) * d, Math.cos(pitch) * d);
    camera.lookAt(0, cy, 0);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', () => placeCamera());
  placeCamera();

  let wetClock = 0;
  function updateWetTex() {                                  // 高さごとの濡れ具合を、つやの絵に描く
    const P1 = P_COUNT - 1;
    for (let y = 0; y < 128; y++) {
      const j = (1 - y / 127) * P1;
      const i = clamp(Math.round(j <= N ? j - 1 : j < INNER_START ? N - 1 : N - 1 - (j - INNER_START)), 0, N - 1), w = rowWet[i];
      wetCtx.fillStyle = 'rgb(' + Math.round((0.28 + 0.72 * w) * 255) + ',' + Math.round(lerp(0.8, 0.36, w) * 255) + ',0)';
      wetCtx.fillRect(0, y, 4, 1);
    }
    wetTex.needsUpdate = true; wetDirty = false;
  }
  let prev = performance.now(), lightMix = 0, compClock = 0;
  const glowEl = $('glow'), tmpCol = new THREE.Color();
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    let camMoved = false;

    /* ---- 形をつくる ---- */
    if (stage === 'shape' || stage === 'intro') {
      if (contact) { press(dt); wet = 1; }
      if (denting) {
        denting.t += dt; wet = 1;
        const sp = dentSpot(hitPot(denting.x, denting.y));
        if (sp && !denting.moved) {                            // 同じ所にふれつづけると、深く・広くなっていく
          const rad = lerp(0.05, 0.11, smoothstep(0.1, 1.4, denting.t)) * denting.size;
          stampDent(sp.u, sp.i, sp.sign * (denting.first ? 0.034 : dt * 0.09) * denting.press, rad);
          denting.first = false; denting.last = sp; rebuild();
        }
        denting.moved = false;
      }
      let moved = false;
      const kH = Math.min(1, dt * 7), kR = Math.min(1, dt * 9);
      if (Math.abs(clay.Ht - clay.H) > 0.0005) { clay.H += (clay.Ht - clay.H) * kH; moved = true; }
      for (let i = 0; i < N; i++) { const d = clay.rt[i] - clay.r[i]; if (Math.abs(d) > 0.0004) { clay.r[i] += d * kR; moved = true; } }
      if (moved || contact) rebuild();
      slumpCool = Math.max(0, slumpCool - dt);
      const tRaw = clay.V / surfaceArea(clay.H, clay.r);
      if (slumpCool === 0 && (tRaw < T_SLUMP || (clay.off > 0.92 && tRaw < 0.055))) slump();
      else if (tRaw < 0.056 && !thinWarned) { thinWarned = true; toast('薄くなってきた。そっと', 1600); }   // へたる前に知らせる
      else if (tRaw > 0.075) thinWarned = false;
      const thin = 1 - clamp((tRaw - T_SLUMP) / 0.1, 0, 1);
      const wob = 0.002 + 0.02 * thin * clamp(clay.H / 2, 0, 1) + 0.075 * clay.off;      // 芯のぶれ
      pot.position.x = wob; pot.rotation.z = -wob * 1.1;
      wet = Math.max(0, wet - dt * 0.5);
      potMat.envMapIntensity = 0.8 + 0.35 * wet; potMat.clearcoatRoughness = 0.3 - 0.12 * wet;   // ふれている間は水がまわって、つやが強まる
      for (let i = 0; i < N; i++) if (rowWet[i] > 0.5) { rowWet[i] = Math.max(0.5, rowWet[i] - dt * 0.07); wetDirty = true; }   // ゆっくり乾いていく
      wetClock += dt;
      if (wetDirty && wetClock > 0.08) { updateWetTex(); wetClock = 0; }
    } else {
      pot.position.x += (0 - pot.position.x) * Math.min(1, dt * 3);                      // 手を離したら芯は落ち着く（かたむきは少し残る）
      pot.rotation.z += (-0.02 * clay.off - pot.rotation.z) * Math.min(1, dt * 3);
    }

    /* ---- 釉薬 ---- */
    if (stage === 'glaze') {
      let sx = 0, sz = 0;
      if (sensor.ok) {
        if (!sensor.base) sensor.base = { b: sensor.beta, g: sensor.gamma };
        sx = clamp((sensor.gamma - sensor.base.g) / 30, -1, 1); sz = clamp((sensor.beta - sensor.base.b) / 30, -1, 1);
      }
      const tx = clamp(sx + lean.dragX, -1, 1), tz = clamp(sz + lean.dragZ, -1, 1), k = Math.min(1, dt * 8);
      lean.x += (tx - lean.x) * k; lean.z += (tz - lean.z) * k;
      let streaming = false;
      if (pouring) {
        const h = hitPot(pouring.x, pouring.y);
        if (h) {
          const uf = h.u * GW;
          if (h.kind === 'out') pourAt(uf, (1 - (h.j - 1) / (N - 1)) * (GH - 1), dt); else pourInside(uf, dt);
          streaming = true; coach.pour += dt;
          const c = GLAZES[glazeSel].rgb.map(v => Math.round(lerp(v, 0.93, 0.12) * 255)).join(','), st = $('stream'), len = Math.min(190, pouring.y - 8);
          st.style.left = pouring.x + 'px'; st.style.top = (pouring.y - len) + 'px'; st.style.height = len + 'px';
          st.style.background = 'linear-gradient(to bottom, rgba(' + c + ',0), rgba(' + c + ',.95) 35%)';
        }
      }
      $('stream').classList.toggle('on', streaming);
      $('pad').classList.toggle('on', !sensor.ok);            // 傾きセンサーが来ていなければ、傾ける丸を出す
      inner.wet = Math.max(0, inner.wet - dt * 0.085);
      // 案内を進める
      coach.t += dt;
      if (Math.hypot(lean.x, lean.z) > 0.35) coach.lean += dt;
      if (coach.step === 0 && coach.pour > 0.6) setCoach(1);
      else if (coach.step === 1 && (coach.lean > 1.2 || coach.t > 14)) setCoach(2);
      const tg = $('target');
      if (coach.step === 0 && !pouring) {                      // 最初だけ、ふれる場所を示す
        axisPt.set(0, clay.H * 0.72, clay.r[Math.round((N - 1) * 0.72)]).project(camera);
        tg.style.left = ((axisPt.x * 0.5 + 0.5) * window.innerWidth) + 'px'; tg.style.top = ((-axisPt.y * 0.5 + 0.5) * window.innerHeight) + 'px';
        tg.classList.add('on');
      } else tg.classList.remove('on');
      if (glazeWet) {
        const c = Math.cos(angle), s = Math.sin(angle);           // 傾きを、回っている器から見た向きに直す
        stepGlaze(dt, lean.x * c - lean.z * s, lean.x * s + lean.z * c, 1);
      }
      compClock += dt;
      if ((glazeDirty && compClock > 0.03) || (glazeWet && compClock > 0.2)) { composite(); compClock = 0; }
    }
    else if (coach.step !== -1) { coach.step = -1; $('target').classList.remove('on'); $('stream').classList.remove('on'); $('pad').classList.remove('on'); lean.dragX = lean.dragZ = 0; }   // 釉薬の段階を出たら、しるしを片づける
    tilt.rotation.z += (-lean.x * 0.3 - tilt.rotation.z) * Math.min(1, dt * 10);
    tilt.rotation.x += (lean.z * 0.3 - tilt.rotation.x) * Math.min(1, dt * 10);

    /* ---- 焼く・冷ます ---- */
    const inKiln = stage === 'kiln', cooling = stage === 'cool';
    if (inKiln) {
      kiln.t += dt;
      const b = Math.max(blowPress ? 0.85 : 0, readMic());
      kiln.blow += (b - kiln.blow) * Math.min(1, dt * (b > kiln.blow ? 6 : 2.5));
      if (kiln.blow > 0.3 && kiln.t > 1) { hintCount += dt; if (hintCount >= 6) $('hint').classList.add('gone'); }
      const target = 780 + 660 * kiln.blow;
      kiln.T += (target - kiln.T) * dt * (target > kiln.T ? 0.32 : 0.11);
      fired.peak = Math.max(fired.peak, kiln.T); fired.blow += kiln.blow * dt;
      if (kiln.T > 1100) fired.soak += dt;
      const m = clamp(fired.soak / 5, 0, 1) * smoothstep(1050, 1200, fired.peak);
      if (kiln.T > 1220) {                                           // 熱で釉薬がふたたび動く
        const mob = clamp((kiln.T - 1220) / 180, 0, 1) * 0.5;
        for (let k = 0; k < GN; k += 1) if (gA[k] > 0.2 && gWet[k] < mob) gWet[k] = mob;
        stepGlaze(dt, 0, 0, mob);
      }
      compClock += dt;
      if (Math.abs(m - fired.m) > 0.03 || (glazeDirty && compClock > 0.25)) { fired.m = m; composite(); compClock = 0; }
      $('tempNum').textContent = Math.round(kiln.T / 5) * 5;
      const deepNow = smoothstep(1250, 1350, fired.peak) * m;
      if (Math.abs(deepNow - fired.deep) > 0.03) { fired.deep = deepNow; glazeDirty = true; }
      // 目安：いまの温度の位置と、いま出したときの仕上がり
      const T = kiln.T, pos = T < 1100 ? clamp((T - 600) / 500, 0, 1) * 0.37 : T < 1280 ? 0.38 + (T - 1100) / 180 * 0.305 : 0.69 + clamp((T - 1280) / 160, 0, 1) * 0.31;
      $('scaleMark').style.left = (pos * 100) + '%';
      const tier = m < 0.5 ? 0 : deepNow < 0.45 ? 1 : 2, zl = $('scale').querySelectorAll('.zl span');
      for (let k = 0; k < 3; k++) zl[k].classList.toggle('on', k === tier);
      $('tempWord').textContent = T < 600 ? 'あぶり'
        : tier === 0 && T >= 1100 ? 'この温度を保つと、釉薬が溶けていく'
        : 'いま出すと：' + TIER_TEXT[tier];
      if (kiln.T > 600) $('btnNext').classList.remove('fadeout');
      if (Math.random() < dt * (2 + 8 * kiln.heat) * (mic.ok ? 0.4 : 1)) crackle();
      $('blowBar').style.width = Math.round(kiln.blow * 100) + '%';
    }
    if (cooling) {
      coolT += dt;
      kiln.blow = 0; kiln.T += (20 - kiln.T) * dt * 1.5;
      $('tempNum').textContent = Math.round(kiln.T / 5) * 5; $('tempWord').textContent = '冷ます';
      if (coolT > 3.4) startDone();
    }
    kiln.heat = (inKiln || cooling) ? clamp((kiln.T - 250) / 1000, 0, 1) : 0;
    const flick = 0.82 + 0.18 * Math.sin(now * 0.013) * Math.sin(now * 0.0071 + 1.3) + (Math.random() - 0.5) * 0.06;
    lightMix += ((inKiln ? 1 : 0) - lightMix) * Math.min(1, dt * (inKiln ? 4 : 1.1));
    hemi.intensity = lerp(0.6, 0.07, lightMix); key.intensity = lerp(0.9, 0.06, lightMix); fill.intensity = lerp(0.38, 0, lightMix); rim.intensity = lerp(0.55, 0, lightMix);
    fireBack.intensity = kiln.heat * flick * 1.5 * (1 + 1.1 * kiln.blow) * lightMix; fireFront.intensity = (0.3 + 0.7 * kiln.heat) * flick * 0.34 * (1 + 0.9 * kiln.blow) * lightMix;
    if (inKiln || cooling) {
      const k = heatColor(kiln.T, tmpCol);
      potMat.emissive.copy(tmpCol); potMat.emissiveIntensity = (0.42 + 0.16 * kiln.blow) * k;
      potMat.envMapIntensity = lerp(1.45, 0.15, lightMix);
      slab.material.emissive.copy(tmpCol); slab.material.emissiveIntensity = 0.08 * k;
      drawFire(dt, kiln.heat * lightMix, kiln.blow);
      fireCanvas.style.opacity = clamp((0.3 + 0.6 * kiln.heat + 0.15 * kiln.blow) * lightMix, 0, 1);
      fireCanvas.style.transform = 'scaleY(' + (1 + 0.2 * kiln.blow) + ')';          // 吹くと炎が立ちあがる
      glowEl.style.opacity = clamp((0.12 + 0.4 * kiln.heat + 0.3 * kiln.blow) * flick * lightMix, 0, 1);
    } else if (fireCanvas.style.opacity !== '0') {
      fireCanvas.style.opacity = '0'; glowEl.style.opacity = '0';
      potMat.emissiveIntensity = 0; slab.material.emissiveIntensity = 0;
    }

    drawEmbers(dt, kiln.heat, kiln.blow, inKiln);

    /* ---- 回転 ---- */
    if (stage === 'done') {
      if (!turn.drag) { turn.vel += (0.3 - turn.vel) * Math.min(1, dt * 0.8); angle += turn.vel * dt; }
    } else angle += dt * spinSpeed;
    spin.rotation.y = angle;

    /* ---- カメラ ---- */
    const target = Math.max(1.9, clay.H + 0.75);
    if (Math.abs(target - viewH) > 0.002) { viewH += (target - viewH) * Math.min(1, dt * 2.2); camMoved = true; }
    if (view.to) {
      const k = Math.min(1, dt * 2.4);
      view.pitch += (view.to.pitch - view.pitch) * k; view.zoom += (view.to.zoom - view.zoom) * k; camMoved = true;
      if (Math.abs(view.to.pitch - view.pitch) < 0.05 && Math.abs(view.to.zoom - view.zoom) < 0.002) view.to = null;
    }
    if (camMoved) placeCamera();

    /* ---- 音 ---- */
    if (audio) {
      const shaping = stage === 'shape' || stage === 'intro';
      friction = Math.max(contact ? 0.38 : denting ? 0.2 : 0, friction - dt * 4.5);
      const turning = shaping && wheelOn;
      setGain(audio.humG, turning ? 0.05 : 0, 0.4); setGain(audio.whir.g, turning ? 0.16 : 0, 0.4);
      setGain(audio.rub.g, shaping ? friction * 0.5 : 0, 0.04);
      audio.rub.f.frequency.setTargetAtTime(560 + friction * 520, audio.ctx.currentTime, 0.06);
      setGain(audio.pour.g, pouring ? 0.14 : glazeWet && stage === 'glaze' ? 0.025 : 0, 0.12);
      const quiet = mic.ok ? 0.45 : 1;                         // マイク使用中は、自分の音を拾って火が強まり続けないよう控えめに
      setGain(audio.roar.g, (inKiln ? 0.12 + 0.3 * kiln.heat + (mic.ok ? 0 : 0.28 * kiln.blow) : cooling ? 0.1 * kiln.heat : 0) * quiet, 0.3);
      audio.roar.f.frequency.setTargetAtTime(280 + 350 * kiln.heat, audio.ctx.currentTime, 0.3);
      setGain(audio.hiss.g, inKiln && !mic.ok ? 0.05 * kiln.heat + 0.22 * kiln.blow : 0, 0.1);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 動作確認用（開発者ツールから状態を読めるようにしておく）
  window.__rokuro = { clay, view, kiln, fired, lean, sensor, mic, used, inner, get stage() { return stage; },
    startShape, startGlaze, startKiln, startCool, startDone, saveImage, slump, pourAt, pourInside, composite, stepGlaze, stampDent, rebuild, setWheel, dent,
    glaze: { gA, gWet, GW, GH, select: i => { glazeSel = i; } }, setBlow: v => { blowPress = v; } };
})();
</script>
</body>
</html>
